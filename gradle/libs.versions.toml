[versions]
apache-avro = "1.12.0"
apache-flink = "2.3.0"
apache-kafka = "4.3.0"
assertj = "3.27.7"
avro-gradle-plugin = "2.0.0"
clikt = "5.1.0"
confluent = "8.3.0"
google-protobuf-java = "4.35.1"
google-protobuf-plugin = "0.10.0"
grpc = "1.83.1"
junit5 = "5.14.4"
kotlin-faker = "1.16.2"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
log4j = "2.26.1"
logback = "1.6.2"
schema-registry = "2.5.0"
slf4j = "2.0.11"

[libraries]
apache-avro = { group = "org.apache.avro", name = "avro", version.ref = "apache-avro" }
apache-kafka-clients = { group = "org.apache.kafka", name = "kafka-clients", version.ref = "apache-kafka" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
clikt = { group = "com.github.ajalt.clikt", name = "clikt", version.ref = "clikt" }
clikt-markdown = { group = "com.github.ajalt.clikt", name = "clikt-markdown", version.ref = "clikt" }
confluent-avro-serializer = { group = "io.confluent", name = "kafka-avro-serializer", version.ref = "confluent" }
confluent-protobuf-serializer = { group = "io.confluent", name = "kafka-protobuf-serializer", version.ref = "confluent" }
confluent-schema-rules = { group = "io.confluent", name = "kafka-schema-rules", version.ref = "confluent" }
google-protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "google-protobuf-java" }
grpc-stub = { group = "io.grpc", name ="grpc-stub", version.ref = "grpc" }
grpc-protobuf = { group = "io.grpc", name ="grpc-protobuf", version.ref = "grpc" }
junit5-jupiter = { group = "org.junit.jupiter",  name = "junit-jupiter", version.ref = "junit5" }
junit5-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kotlin-faker = { group = "io.github.serpro69", name = "kotlin-faker", version.ref = "kotlin-faker" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

[bundles]

[plugins]
avro-gradle = { id = "io.github.martinsjavacode.avro-gradle-plugin", version.ref = "avro-gradle-plugin" }
google-protobuf = { id = "com.google.protobuf", version.ref = "google-protobuf-plugin" }
schema-registry = { id = "com.github.imflog.kafka-schema-registry-gradle-plugin", version.ref = "schema-registry" }
